name: Stáhnout číselník kategorií Heureka
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stahni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p data
          curl -sfL -A "Mozilla/5.0" "https://www.heureka.cz/direct/xml-export/shops/heureka-sekce.xml" -o data/heureka_kategorie.xml
          ls -la data/heureka_kategorie.xml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heureka_kategorie.xml
          git diff --cached --quiet || (git commit -m "Číselník kategorií Heureka" && git pull --rebase -q && git push)
