name: Kontrola skladu a cen

on:
  schedule:
    # časy jsou v UTC (v Česku +2 h v létě, +1 h v zimě): cca 5:40, 11:40 a 17:40 letního času
    - cron: "40 3,9,15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aktualizace
  cancel-in-progress: false

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace knihoven
        run: pip install -r skript/requirements.txt

      - name: Schválené ceny držet ve feedu 48 hodin, pak vyprázdnit
        run: |
          if [ -f feed/ceny.csv ] && [ "$(wc -l < feed/ceny.csv)" -gt 1 ]; then
            kdy=$(git log -1 --format=%ct -- feed/ceny.csv)
            if [ $(( $(date +%s) - kdy )) -gt 172800 ]; then
              head -n 1 feed/ceny.csv > /tmp/h && mv /tmp/h feed/ceny.csv
              echo "Schválené ceny jsou už v Shoptetu, feed cen vyprázdněn."
            fi
          fi

      - name: Kontrola dodavatelů
        id: kontrola
        run: python skript/aktualizace.py

      - name: Uložit sklad a zprávu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/ data/stav.json zprava.md navrh/
          if ! git diff --cached --quiet; then
            git commit -m "Sklad a ceny $(TZ=Europe/Prague date '+%d.%m.%Y %H:%M')"
            git push origin HEAD:main
          fi

      - name: Návrh cen ke schválení (Pull request)
        env:
          GH_TOKEN: ${{ github.token }}
          NAVRHU: ${{ steps.kontrola.outputs.navrhu }}
        run: |
          OTEVRENY=$(gh pr list --head navrh-cen --state open --json number -q '.[0].number')
          if [ "${NAVRHU:-0}" -gt 0 ]; then
            git checkout -B navrh-cen
            cp navrh/ceny.csv feed/ceny.csv
            git add feed/ceny.csv
            git commit -m "Návrh cen ke schválení ($NAVRHU změn)"
            git push -f origin navrh-cen
            TITULEK="Ke schválení: změny cen ($NAVRHU produktů)"
            if [ -z "$OTEVRENY" ]; then
              gh pr create --base main --head navrh-cen --title "$TITULEK" --body-file navrh/popis.md
            else
              gh pr edit "$OTEVRENY" --title "$TITULEK" --body-file navrh/popis.md
            fi
          elif [ -n "$OTEVRENY" ]; then
            gh pr close "$OTEVRENY" --comment "Ceny už odpovídají doporučeným, návrh není potřeba." --delete-branch
          fi
