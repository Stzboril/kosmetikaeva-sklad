name: Kontrola skladu a cen

on:
  schedule:
    # UTC čas; v Česku cca 6:15 (letní čas) / 5:15 (zimní čas)
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: aktualizace
  cancel-in-progress: false

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalace knihoven
        run: pip install -r skript/requirements.txt

      - name: Kontrola dodavatelů
        id: kontrola
        run: python skript/aktualizace.py

      - name: Uložit výsledek
        id: ulozit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ke_importu/ data/stav.json zprava.md
          # nové upozornění jen když se změnilo, co je potřeba naimportovat
          if git diff --cached --quiet -- ke_importu/; then echo "nove=0" >> "$GITHUB_OUTPUT"; else echo "nove=1" >> "$GITHUB_OUTPUT"; fi
          if ! git diff --cached --quiet; then
            git commit -m "Kontrola $(TZ=Europe/Prague date '+%d.%m.%Y %H:%M')"
            git push origin HEAD:main
          fi

      - name: Upozornění (GitHub issue + e-mail)
        env:
          GH_TOKEN: ${{ github.token }}
          SKLAD: ${{ steps.kontrola.outputs.sklad }}
          CENY: ${{ steps.kontrola.outputs.ceny }}
          NOVE: ${{ steps.ulozit.outputs.nove }}
        run: |
          gh label create k-importu --color FBCA04 --description "Změny k importu do Shoptetu" 2>/dev/null || true
          OTEVRENE=$(gh issue list --label k-importu --state open --json number -q '.[].number')
          if [ "${SKLAD:-0}" -eq 0 ] && [ "${CENY:-0}" -eq 0 ]; then
            for n in $OTEVRENE; do gh issue close "$n" --comment "Vše odpovídá dodavatelům, není co importovat."; done
          elif [ "$NOVE" = "1" ] || [ -z "$OTEVRENE" ]; then
            for n in $OTEVRENE; do gh issue close "$n" --comment "Nahrazeno novější kontrolou."; done
            gh issue create --label k-importu \
              --title "K importu $(TZ=Europe/Prague date '+%d.%m.%Y'): sklad ${SKLAD:-0}, ceny ${CENY:-0}" \
              --body-file zprava.md
          fi
