name: Test připojení k dodavatelům
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Zkusit stáhnout stránky dodavatelů
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          for u in \
            "https://www.euronabycerny.com/webapi/eshop/products/all?page=1" \
            "https://www.euronabycerny.com/webapi/eshop/sku/3044" \
            "https://www.essens.cz/parfemy-c21/" \
            "https://www.essens.cz/damsky-parfem-w151-d127820/" \
            "https://www.lr-czech.com/parfemy-damske" \
            "https://www.kosmetikaeva.eu/" ; do
            code=$(curl -s -o /tmp/out -w "%{http_code} %{size_download}B %{time_total}s" -A "$UA" -H "Accept-Language: cs-CZ,cs;q=0.9" "$u")
            echo "$u -> $code"
            head -c 300 /tmp/out | tr '\n' ' '; echo; echo
          done
