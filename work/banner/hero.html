<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
body{margin:0;width:1920px;height:400px;font-family:Poppins,sans-serif;background:#f7f3ef;color:#1a1937;overflow:hidden}
.wrap{display:flex;align-items:center;height:400px;padding:0 120px;gap:40px}
.text{flex:0 0 760px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:20px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#aa3b29}
h1{margin:0;font-size:42px;line-height:1.14;font-weight:700}
.sub{font-size:22px;line-height:1.5;color:#4a4a5e;margin:0}
.row{display:flex;align-items:center;gap:28px;margin-top:6px}
.btn{background:#aa3b29;color:#fff;font-weight:600;font-size:22px;padding:16px 34px;border-radius:999px}
.rating{font-size:20px;display:flex;align-items:center;gap:10px}
.stars{color:#e0a100;font-size:24px;letter-spacing:2px}
.cards{flex:1;display:flex;gap:20px;align-items:center;justify-content:flex-end}
.card{background:#fff;border-radius:24px;width:190px;height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px}
.card img{width:160px;height:215px;object-fit:contain;object-position:50% 100%}
.card span{font-size:16px;color:#4a4a5e}
</style></head>
<body><div class="wrap">
<div class="text">
<div class="eyebrow">Just · LR · Eurona · Essens · Nahrin</div>
<h1>Kosmetika, parfémy a drogerie od značek, které znáte</h1>
<p class="sub">Stovky produktů skladem · Na Zásilkovnu zdarma od 2 500 Kč</p>
<div class="row"><div class="btn">Vybrat z nabídky</div><div class="rating"><span class="stars">★★★★★</span><span><b>4,9 z 5</b> · 545 hodnocení obchodu</span></div></div>
</div>
<div class="cards">
<div class="card"><img src="img/just_olej31_crop.png"><span>Just</span></div>
<div class="card"><img src="img/essens_w114_crop.png"><span>Essens</span></div>
<div class="card"><img src="img/lr_colostrum_crop.png"><span>LR</span></div>
<div class="card"><img src="img/eurona_praci_crop.png"><span>Eurona</span></div>
</div>
</div></body></html>
