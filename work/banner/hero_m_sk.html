<!doctype html>
<html lang="sk"><head><meta charset="utf-8">
<style>
@font-face{font-family:'CG';src:url('cormorant-garamond-600.ttf');font-weight:600}
@font-face{font-family:'CG';src:url('cormorant-garamond-500.ttf');font-weight:500}
*{box-sizing:border-box}
body{margin:0;width:750px;height:600px;font-family:Poppins,sans-serif;background:#faf7f2;color:#1d1b2f;overflow:hidden}
.wrap{padding:40px 44px;display:flex;flex-direction:column;gap:16px;height:600px}
.eyebrow{font-size:17px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#aa3b29}
h1{margin:0;font-family:CG,serif;font-size:54px;line-height:1.04;font-weight:600;font-variant-numeric:lining-nums;text-wrap:balance}
.sub{font-size:22px;color:#4a4a5e;margin:0}
.cards{display:flex;gap:16px;margin-top:6px}
.card{background:#fff;border:1px solid rgba(29,27,47,.08);border-radius:22px;flex:1;height:190px;display:flex;align-items:center;justify-content:center;padding:12px}
.card img{width:100%;height:166px;object-fit:contain;object-position:50% 100%}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.btn{background:#aa3b29;color:#fff;font-weight:500;font-size:19px;letter-spacing:.14em;text-transform:uppercase;padding:16px 32px;border-radius:999px;white-space:nowrap}
.rating{font-size:20px;white-space:nowrap}
.stars{color:#b8955a;letter-spacing:2px}
</style></head>
<body><div class="wrap">
<div class="eyebrow">Just · LR · Eurona · Essens · Nahrin</div>
<h1>Kozmetika, parfumy a drogéria od značiek, ktoré poznáte</h1>
<p class="sub">Stovky produktov skladom · Doprava zadarmo nad 120 €</p>
<div class="cards">
<div class="card"><img src="img/just_olej31_crop.png"></div>
<div class="card"><img src="img/essens_w114_crop.png"></div>
<div class="card"><img src="img/lr_colostrum_crop.png"></div>
<div class="card"><img src="img/eurona_praci_crop.png"></div>
</div>
<div class="row"><div class="btn">Vybrať z ponuky</div><div class="rating"><span class="stars">★★★★★</span> <b>4,9 z 5</b></div></div>
</div></body></html>
