<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<style>
@font-face{font-family:'MS';src:url('montserrat-700.ttf');font-weight:700}
@font-face{font-family:'MS';src:url('montserrat-600.ttf');font-weight:600}
@font-face{font-family:'MS';src:url('montserrat-500.ttf');font-weight:500}
@font-face{font-family:'MS';src:url('montserrat-400.ttf');font-weight:400}
*{box-sizing:border-box}
body{margin:0;width:750px;height:600px;font-family:MS,sans-serif;background:linear-gradient(120deg,#ffffff 0%,#fbf3f1 100%);color:#1c1b29;overflow:hidden}
.wrap{padding:40px 44px;display:flex;flex-direction:column;gap:16px;height:600px}
.eyebrow{font-size:16px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#a3392a}
h1{margin:0;font-family:MS,sans-serif;font-size:46px;line-height:1.12;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{font-size:22px;color:#4a4a5e;margin:0}
.cards{display:flex;gap:16px;margin-top:6px}
.card{background:#fff;border:1px solid #f0eff3;border-radius:22px;box-shadow:0 12px 34px rgba(28,27,41,.07);flex:1;height:190px;display:flex;align-items:center;justify-content:center;padding:12px}
.card img{width:100%;height:166px;object-fit:contain;object-position:50% 100%}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.btn{background:#a3392a;color:#fff;font-weight:600;font-size:19px;letter-spacing:.12em;text-transform:uppercase;padding:16px 32px;border-radius:999px;white-space:nowrap}
.rating{font-size:20px;white-space:nowrap}
.stars{color:#e0a100;letter-spacing:2px}
</style></head>
<body><div class="wrap">
<div class="eyebrow">Just · LR · Eurona · Essens · Nahrin</div>
<h1>Kosmetika, parfémy a drogerie od značek, které znáte</h1>
<p class="sub">Stovky produktů skladem · Zásilkovna zdarma od 2 500 Kč</p>
<div class="cards">
<div class="card"><img src="img/just_olej31_crop.png"></div>
<div class="card"><img src="img/essens_w114_crop.png"></div>
<div class="card"><img src="img/lr_colostrum_crop.png"></div>
<div class="card"><img src="img/eurona_praci_crop.png"></div>
</div>
<div class="row"><div class="btn">Vybrat z nabídky</div><div class="rating"><span class="stars">★★★★★</span> <b>4,9 z 5</b></div></div>
</div></body></html>
