<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
body{margin:0;width:750px;height:600px;font-family:Poppins,sans-serif;background:#f7f3ef;color:#1a1937;overflow:hidden}
.wrap{padding:40px 44px;display:flex;flex-direction:column;gap:16px;height:600px}
.eyebrow{font-size:20px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#aa3b29}
h1{margin:0;font-size:40px;line-height:1.15;font-weight:700}
.sub{font-size:22px;color:#4a4a5e;margin:0}
.cards{display:flex;gap:16px;margin-top:6px}
.card{background:#fff;border-radius:22px;flex:1;height:190px;display:flex;align-items:center;justify-content:center;padding:12px}
.card img{width:100%;height:166px;object-fit:contain;object-position:50% 100%}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.btn{background:#aa3b29;color:#fff;font-weight:600;font-size:22px;padding:14px 30px;border-radius:999px}
.rating{font-size:20px}
.stars{color:#e0a100;letter-spacing:2px}
</style></head>
<body><div class="wrap">
<div class="eyebrow">Just · LR · Eurona · Essens · Nahrin</div>
<h1>Kosmetika, parfémy a drogerie od značek, které znáte</h1>
<p class="sub">Stovky produktů skladem · Zásilkovna zdarma od 2 500 Kč</p>
<div class="cards">
<div class="card"><img src="img/just_olej31_crop.png"></div>
<div class="card"><img src="img/essens_w114_crop.png"></div>
<div class="card"><img src="img/lr_colostrum_crop.png"></div>
<div class="card"><img src="img/eurona_praci_crop.png"></div>
</div>
<div class="row"><div class="btn">Vybrat z nabídky</div><div class="rating"><span class="stars">★★★★★</span> <b>4,9 z 5</b></div></div>
</div></body></html>
