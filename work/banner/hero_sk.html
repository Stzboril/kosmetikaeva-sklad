<!doctype html>
<html lang="sk"><head><meta charset="utf-8">
<style>
@font-face{font-family:'MS';src:url('montserrat-700.ttf');font-weight:700}
@font-face{font-family:'MS';src:url('montserrat-600.ttf');font-weight:600}
@font-face{font-family:'MS';src:url('montserrat-500.ttf');font-weight:500}
@font-face{font-family:'MS';src:url('montserrat-400.ttf');font-weight:400}
*{box-sizing:border-box}
body{margin:0;width:1920px;height:400px;font-family:MS,sans-serif;background:linear-gradient(120deg,#ffffff 0%,#fbf3f1 100%);color:#1c1b29;overflow:hidden}
.wrap{display:flex;align-items:center;height:400px;padding:0 120px;gap:40px}
.text{flex:0 0 760px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:16px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:#a3392a}
h1{margin:0;font-family:MS,sans-serif;font-size:44px;line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{font-size:22px;line-height:1.5;color:#3f3d4f;margin:0}
.row{display:flex;align-items:center;gap:28px;margin-top:6px}
.btn{background:#a3392a;color:#fff;font-weight:600;font-size:17px;letter-spacing:.14em;text-transform:uppercase;padding:18px 36px;border-radius:999px;white-space:nowrap}
.rating{font-size:20px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.stars{color:#e0a100;font-size:24px;letter-spacing:2px}
.cards{flex:1;display:flex;gap:20px;align-items:center;justify-content:flex-end}
.card{background:#fff;border:1px solid #f0eff3;border-radius:22px;box-shadow:0 12px 34px rgba(28,27,41,.07);width:190px;height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px}
.card img{width:160px;height:215px;object-fit:contain;object-position:50% 100%}
.card span{font-size:17px;font-weight:600;color:#1c1b29}
</style></head>
<body><div class="wrap">
<div class="text">
<div class="eyebrow">Just · LR · Eurona · Essens · Nahrin</div>
<h1>Kozmetika, parfumy a drogéria od značiek, ktoré poznáte</h1>
<p class="sub">Stovky produktov skladom · Doprava zadarmo nad 120 €</p>
<div class="row"><div class="btn">Vybrať z ponuky</div><div class="rating"><span class="stars">★★★★★</span><span><b>4,9 z 5</b> · 545 hodnotení obchodu</span></div></div>
</div>
<div class="cards">
<div class="card"><img src="img/just_olej31_crop.png"><span>Just</span></div>
<div class="card"><img src="img/essens_w114_crop.png"><span>Essens</span></div>
<div class="card"><img src="img/lr_colostrum_crop.png"><span>LR</span></div>
<div class="card"><img src="img/eurona_praci_crop.png"><span>Eurona</span></div>
</div>
</div></body></html>
